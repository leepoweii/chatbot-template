[project]
name = "chatbot-template"
version = "0.1.0"
description = "Agentic search chatbot template: claude -p harness + a CLAUDE.md-indexed data/ folder."
authors = [
    { name = "leepoweii", email = "powei.lee@welly.tw" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
